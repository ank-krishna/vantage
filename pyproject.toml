[project]
name = "marketstore"
version = "0.1.0"
description = "A point-in-time-correct feature store for market data, with an online/offline skew demonstrator."
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
